name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required to create the GitHub Release
      contents: write
      # Required for Marketplace Trusted Publishing (OIDC)
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      # Publish to the Visual Studio Marketplace without a stored token
      - run: npx @vscode/vsce publish --oidc

      # Build the .vsix attached to the GitHub Release
      - run: npx @vscode/vsce package

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for details."
        env:
          GH_TOKEN: ${{ github.token }}